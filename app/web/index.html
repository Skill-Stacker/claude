<title>StickOS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: #10131a;
    color: #e7ebf3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  main {
    max-width: 32rem;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
  }
  p {
    color: #9aa4b8;
    margin: 0.25rem 0;
  }
  #log {
    margin-top: 1.5rem;
    text-align: left;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: #6f7891;
    max-height: 8rem;
    overflow-y: auto;
    border-top: 1px solid #262b38;
    padding-top: 0.75rem;
  }
  #log div {
    padding: 0.1rem 0;
  }
</style>
<main>
  <h1 id="status">StickOS server is starting</h1>
  <p id="detail">This page will replace itself once the real UI is built.</p>
  <div id="log"></div>
</main>
<script>
  window.STICKOS_TOKEN = "__STICKOS_TOKEN__";
  window.STICKOS_ORIGIN = "__STICKOS_ORIGIN__";
</script>
<script>
  (function () {
    var statusEl = document.getElementById('status');
    var logEl = document.getElementById('log');

    function log(line) {
      var row = document.createElement('div');
      var time = new Date().toLocaleTimeString();
      row.textContent = '[' + time + '] ' + line;
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    fetch('/api/status')
      .then(function (res) { return res.json(); })
      .then(function (status) {
        statusEl.textContent = 'StickOS server is running on port ' + status.port;
        log('connected to the app server, version ' + status.version);
      })
      .catch(function () {
        statusEl.textContent = 'StickOS server did not answer';
      });

    var source = new EventSource('/api/events');
    source.addEventListener('hello', function () {
      log('event stream open');
    });
    source.addEventListener('netlog', function (event) {
      try {
        var entry = JSON.parse(event.data);
        log('net: ' + entry.host + ' (' + entry.purpose + ')');
      } catch (err) {
        log('net: unreadable entry');
      }
    });
    source.onerror = function () {
      log('event stream lost, the browser will retry');
    };

    // The server sends a plain ": ping" comment every 15 seconds to keep
    // the connection open; comments are invisible to EventSource, so this
    // prints its own heartbeat line on the same cadence as a visible sign
    // the page is still listening.
    setInterval(function () {
      if (source.readyState === EventSource.OPEN) log('heartbeat, still listening');
    }, 15000);
  })();
</script>
